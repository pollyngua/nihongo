<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>flashcards-kanji</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=BIZ+UDPMincho:400,700|BIZ+UDMincho:400,700|Noto+Sans:400">
  <link rel="stylesheet" href="css/flashcards-kanji.css">
  <link rel="shortcut icon" href="../img/flashcards-kanji_favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="../img/flashcards-kanji_apple-touch-icon.png">
</head>
<body>

  <div id="container">
    <button id="prevBtn">prev</button>
    <div id="card">
      <div id="kanji"></div>
      <div id="kana" class="hidden"></div>
      <div id="details" class="hidden"></div>
    </div>
    <button id="nextBtn">next</button>
  </div>

  <div id="display">
    <span id="uniqueCounter"><span>0</span> / 0</span>
    <!-- <button id="kanjiBtn">kanji only: OFF</button> -->
    <button id="last100Btn">last 100</button>
    <select id="posFilter">
      <option value="all">all levels</option>
      <option value="jlptn5">JLPT N5</option>
      <option value="jlptn4">JLPT N4</option>
      <option value="jlptn3">JLPT N3</option>
      <option value="jlptn2">JLPT N2</option>
      <option value="jlptn1">JLPT N1</option>
    </select>
  </div>

  <script src="js/words-kanji.js"></script>
  <script src="js/flashcards-kanji.js"></script>
</body>
</html>
